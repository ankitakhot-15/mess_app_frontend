name: mayechi_chav
description: Mayechi Chav - Gharguti Bhojan app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  get: ^4.6.6
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  razorpay_flutter: ^1.3.7   # customer online payment (Android / iOS)
  geolocator: ^14.1.2        # delivery boy live location
  geocoding: ^3.0.0          # lat/lng -> area name
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  socket_io_client: ^3.1.6
  flutter_background_service: ^5.1.0
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
